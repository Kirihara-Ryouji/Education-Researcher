name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an Education Researcher feature. Describe the education research task, researcher decision, and evidence or privacy requirements it should support.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve? What are you trying to do?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of the project does this relate to?
      options:
        - Education study workflow / evidence
        - Education methods and skills
        - Student data privacy / ethics
        - CLI / launch (brainpilot up, init)
        - Agents / orchestration (Principal, specialists, mailbox)
        - Web UI
        - MCP / tools
        - Skills library
        - Providers / models
        - Docker / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any mockups, screenshots, or references that help explain the feature.
