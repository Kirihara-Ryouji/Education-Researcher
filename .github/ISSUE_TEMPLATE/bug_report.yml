name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an Education Researcher issue. Please describe the affected research direction and use de-identified examples. Do not paste student records, API keys, or private research files.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run '...'
        2. Open '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - This repository from source (npm run bp)
        - Docker build from this repository
        - Upstream @brainpilot/app package
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Source revision or package version
      placeholder: e.g. a Git commit SHA, or an upstream package version

  - type: dropdown
    id: research_domain
    attributes:
      label: Research direction
      description: Select the session profile where the issue occurred.
      options:
        - Education research
        - Neuroscience (explicitly selected)
        - Legacy session without a profile
        - Not session-specific
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. v22.13.0 (run `node --version`)

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. macOS 14.2, Windows 11, Ubuntu 22.04

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Include sanitized error messages or screenshots. Remove student data, citations from private material, and credentials before posting.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be helpful (custom model/gateway, MCP servers configured, etc.).
